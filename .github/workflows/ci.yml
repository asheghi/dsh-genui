name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # minimum, current and next represent the continuously rolling
        # compatibility duties; replace the matching tag when a new host ships.
        include:
          - node: 24
            host-ref: "dsh-v0.1.2-rc.1"
            role: minimum
          - node: 22
            host-ref: "dsh-v0.1.7-rc.2"
            role: current
          - node: 24
            host-ref: "dsh-v0.1.7-rc.2"
            role: current
          - node: 24
            host-ref: "dsh-v0.2.0-rc.1"
            role: next
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # The host checkout serves the real packed e2e; the API check installs the
      # npm-published package at the pinned tag.
      - name: Clone pinned DSH host at DSH_ROOT
        run: |
          DSH_ROOT="$GITHUB_WORKSPACE/../../.dsh/source/current"
          mkdir -p "$(dirname "$DSH_ROOT")"
          git clone --depth 1 --branch "${{ matrix.host-ref }}" "https://github.com/deepseek-ai/deepseek-harness.git" "$DSH_ROOT"
          test -f "$DSH_ROOT/packages/client/ui-primitives/src/index.ts" || { echo "::error::host precheck failed: ui-primitives sources are missing"; exit 1; }
          echo "HOST_SHA=$(git -C "$DSH_ROOT" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install + build host
        working-directory: ${{ github.workspace }}/../../.dsh/source/current
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Node 22 runtime (typecheck + full tests + build)
        if: matrix.node == 22 && matrix.role == 'current'
        run: pnpm run check

      - name: Build minimum host plugin
        if: matrix.role == 'minimum'
        run: pnpm run build

      - name: Check published host API (typecheck + build)
        if: matrix.role != 'minimum'
        run: pnpm run check:host-api "${{ matrix.host-ref }}"

      - name: Verify and pack plugin tarball
        id: pack
        run: node scripts/verify-pack.mjs --keep

      # no-key smoke: isolated DSH_HOME + the exact host binary + a fixed port,
      # never touching any live instance; the host binary must live inside this
      # checkout.
      - name: Smoke e2e (no model key)
        run: |
          node scripts/e2e.mjs --smoke --install tarball --tarball "${{ steps.pack.outputs.tarball }}" --tarball-sha256 "${{ steps.pack.outputs.sha256 }}" --port 3190
        env:
          DSH_ROOT: ${{ github.workspace }}/../../.dsh/source/current
          DSH_BIN: ${{ github.workspace }}/../../.dsh/source/current/apps/cli/lib/bin.js

      - name: Archive e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-*.png
            dsh-web.log
          if-no-files-found: ignore

  windows-pack:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack
        run: npm pack --json
